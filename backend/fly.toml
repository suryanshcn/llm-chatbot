# Deploy: fly launch --no-deploy --copy-config ; fly volumes create data --size 1 ;
#         fly secrets set LLM_API_KEYS=key1,key2 ALLOWED_ORIGINS=https://<your-frontend> ; fly deploy
app = "CHANGE-ME-llm-chatbot-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DATABASE_URL = "sqlite:////data/app.db"
  ENABLE_FAILURE_SIMULATION = "true"
  LLM_MODEL = "gemini/gemini-2.5-flash-lite"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"
