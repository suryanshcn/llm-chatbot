# fly.toml app configuration file generated for suryansh-llm-chatbot-api on 2026-11-25T14:28:00+05:30
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'suryansh-llm-chatbot-api'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_URL = 'sqlite:////data/app.db'
  ENABLE_FAILURE_SIMULATION = 'true'
  LLM_MODEL = 'gemini/gemini-3.5-flash-lite'
  PORT = '8000'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
