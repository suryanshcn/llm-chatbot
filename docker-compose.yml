services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      LLM_API_KEYS: ${LLM_API_KEYS:?Set LLM_API_KEYS in .env (see .env.example)}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-2.5-flash-lite}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
      DEFAULT_SYSTEM_PROMPT: ${DEFAULT_SYSTEM_PROMPT:-You are a helpful, concise assistant.}
    volumes:
      - appdata:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports: ["3000:80"]
    depends_on: [backend]
    restart: unless-stopped

volumes:
  appdata:
